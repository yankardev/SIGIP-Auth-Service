spring.application.name=auth-service
server.port=${PORT:9003}

# --- Base de datos (MySQL local; en la nube se usa el perfil "cloud" con PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigip_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Yprogramacion2025}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Seguridad ---
sigip.jwt.secret=${JWT_SECRET:+a7Bb1goFtCSc7TUMrL2S2TJ2hzXRJHb68VnOinThc4=}
sigip.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
sigip.admin.username=${SIGIP_ADMIN_USERNAME:admin}
sigip.admin.email=${SIGIP_ADMIN_EMAIL:admin@sigip.local}
sigip.admin.password=${SIGIP_ADMIN_PASSWORD:admin123456789}

# --- Descubrimiento y monitoreo ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9001/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
